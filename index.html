<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open Links</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔗</text></svg>">
  <link rel="stylesheet" href="styles.css?v=2" />
  
  <script>
    const APP_VERSION = "1.0.1"; 
    
    if (localStorage.getItem("app_version") !== APP_VERSION) {
      localStorage.setItem("app_version", APP_VERSION);
      // Limpa caches de requisições antigas e força o recarregamento total
      if ('caches' in window) {
        caches.keys().then(names => { names.forEach(name => caches.delete(name)); });
      }
      window.location.reload(true);
    }
  </script>
  
</head>
<body>
  <div class="app-shell">
    <header>
      <h1>Open Links</h1>
      <p>Crie blocos de links, renomeie-os e abra todos de uma vez.</p>
    </header>

    <section class="controls">
      <input id="block-name-input" type="text" placeholder="Nome do bloco (ex: Movidesk)" />
      <button id="create-block-button">Criar bloco</button>
    </section>

    <section id="blocks-container" class="blocks-container" aria-live="polite"></section>

    <footer>
      <p>Os dados são salvos localmente no navegador, acessíveis apenas neste perfil.</p>
      <p class="credit">Desenvolvido por Bruno Suzuki</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
