<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open Links</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔗</text></svg>">
  <link rel="stylesheet" href="styles.css" />
  
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="header-main">
        <div>
          <h1>Open Links</h1>
          <p>Crie blocos de links, renomeie-os e abra todos de uma vez.</p>
        </div>
        <div class="auth-wrapper">
          <div class="auth-status" id="auth-status">Não conectado</div>
          <button id="auth-open-button" class="secondary">Entrar / Criar conta</button>
          <button id="logout-button" class="secondary hidden">Sair</button>
        </div>
      </div>

      <form id="auth-form" class="auth-form hidden" autocomplete="off">
        <label>
          Email
          <input id="auth-email" type="email" placeholder="seu@email.com" required />
        </label>
        <label>
          Senha
          <input id="auth-password" type="password" placeholder="Senha segura" required />
        </label>
        <div class="auth-actions">
          <button id="login-button" type="button" class="primary">Entrar</button>
          <button id="signup-button" type="button" class="secondary">Criar conta</button>
        </div>
        <p class="auth-help">Ao entrar, seus blocos e links serão salvos por e-mail e senha.</p>
      </form>
    </header>

    <section class="controls">
      <input id="block-name-input" type="text" placeholder="Nome do bloco (ex: Movidesk)" />
      <button id="create-block-button">Criar bloco</button>
    </section>

    <section id="blocks-container" class="blocks-container" aria-live="polite"></section>

    <footer>
      <p>Os dados são salvos localmente no navegador, acessíveis apenas neste perfil.</p>
      <p class="credit">Desenvolvido por Bruno Suzuki</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
